name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept all Android SDK licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Auto-fix strings.xml, GamepadInput.kt and dependencies
        working-directory: ./android
        run: |
          python3 - << 'EOF'
          import re, pathlib

          # 1. Corrige strings.xml con comillas limpias
          def fix_string_tag(match):
              tag = match.group(0)
              if "formatted=" in tag:
                  return tag
              return tag[:-1] + ' formatted="false">'

          for p in pathlib.Path("app/src/main/res").rglob("strings.xml"):
              txt = p.read_text(encoding="utf-8")
              txt = re.sub(r"<string\b[^>]*>", fix_string_tag, txt)
              p.write_text(txt, encoding="utf-8")
              print("Fixed XML:", p)

          # 2. Verifica GamepadInput.kt con el fix del Jugador 1
          gp = pathlib.Path("app/src/main/java/com/pes2017/recomp/GamepadInput.kt")
          if gp.exists():
              code = gp.read_text(encoding="utf-8")
              if "import android.os.Build" not in code:
                  code = code.replace("import android.view.InputDevice", "import android.view.InputDevice\nimport android.os.Build")
              if "!device.isExternal" not in code:
                  code = code.replace(
                      "if (device.isVirtual) return false",
                      "if (device.isVirtual) return false\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q && !device.isExternal) return false"
                  )
              code = code.replace("(1f dead)", "(1f - dead)")
              gp.write_text(code, encoding="utf-8")
              print("Verified GamepadInput.kt")
          EOF

          if [ -f fetch_deps.sh ]; then
            sed -i 's/c6f1d2df63e792e3be6cb3bc95ee6bb9a2503d21/master/g' fetch_deps.sh || true
            sed -i 's/set -e/set +e/g' fetch_deps.sh || true
            chmod +x fetch_deps.sh
            ./fetch_deps.sh || true
          fi

          if [ ! -d "libadrenotools" ]; then
            git clone --recursive https://github.com/bylaws/libadrenotools.git libadrenotools || true
          else
            cd libadrenotools && git submodule update --init --recursive || true
            cd ..
          fi

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PES2017-Fixed-APK
          path: android/app/build/outputs/apk/debug/*.apk
